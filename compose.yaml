services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-samjhao}
      POSTGRES_USER: ${POSTGRES_USER:-samjhao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samjhao_local_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-samjhao} -d ${POSTGRES_DB:-samjhao}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
